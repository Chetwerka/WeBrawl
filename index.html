<!DOCTYPE html>
<html>
<head>
<title>Регистрация</title>

<style>







form {

&#x20; width: 250px;

&#x20; margin: 100px auto;

&#x20; padding: 20px;

&#x20; background-color: #111;

} 

h1 {

color: blue;

font-size: 35px;

}



body {

&#x20; background-color: black;

&#x20; color: white;

}



input {

&#x20; display: block;

&#x20; margin-bottom: 10px;

&#x20; padding: 6px;

&#x20; width: 100%;

}



input:focus {

&#x20; outline: 2px solid blue;

}



label {

&#x20; display: block;

&#x20; margin-top: 10px;

}



button {

&#x20; width: 100%;

&#x20; padding: 10px;

&#x20; margin-top: 10px;

&#x20; background-color: gray;

&#x20; color: blue;

&#x20; border: none;

}



button:hover {

&#x20; background-color: #888;

&#x20; cursor: pointer;

}



button:active {

&#x20; transform: scale(0.98);

}



button, input {

&#x20; transition: 0.2s;

}

  #bar-container {
  width: 100%;
  height: 10px;
  background: #333;
  border-radius: 5px;
}

#bar {
  width: 0%;
  height: 10px;
  background: red;
  border-radius: 5px;
  transition: 0.3s;
}

</style>



</head>
<body>


<form>

<h1>Регистрация</h1>  

<label>Логин</label>
<input type="text" id="log" oninput="checkPoles()">
<label>Пароль:</label>
<input type="password" id="pass1" oninput="checkPoles();checkStrength()">
<p id="strength"></p>
<div id="bar-container">
  <div id="bar"></div>
</div>
<button type="button" id="toggleSkrit" onclick="togglePassword()">
Показать пароль
</button>
<label>Повторите пароль</label>
<input type="password" id="pass2" oninput="checkPoles()">

<button type="button" onclick="checkPasswords()" id="registerBtn" disabled>
Зарегистрироваться
</button>

<p id="message"></p>

</form>

 <script>

function checkPasswords() {
  let p1 = document.getElementById("pass1").value;
  let p2 = document.getElementById("pass2").value;
  let msg = document.getElementById("message");

  if (!p1 || !p2) {
    msg.textContent = "Заполни все поля";
    msg.style.color = "orange";
    return;
  }

  if (p1 !== p2) {
    msg.textContent = "Пароли не совпадают";
    msg.style.color = "red";
    return;
  }

  msg.textContent = "Успешная регистрация";
  msg.style.color = "green";

  localStorage.setItem("log", document.getElementById("log").value);
}

function checkPoles() {

 let pass1Input = document.getElementById("pass1");
 let pass2Input = document.getElementById("pass2"); 
 let logInput = document.getElementById("log");
 
 let btn = document.getElementById("registerBtn")

 if (    
    pass1Input.value === "" ||                      
    pass2Input.value === "" ||
    logInput.value === ""
 ) {

 btn.disabled = true

 } else {

 btn.disabled = false

}

}

function checkStrength() {
  let pass1Input = document.getElementById("pass1");
  let p1 = pass1Input.value;

  let strength = document.getElementById("strength");
  let bar = document.getElementById("bar");

  if (p1.length < 4) {
    bar.style.width = "33%";
    bar.style.backgroundColor = "red";
    strength.textContent = "Слабый пароль";
  } 
  else if (p1.length < 8) {
    bar.style.width = "66%";
    bar.style.backgroundColor = "orange";
    strength.textContent = "Средний пароль";
  } 
  else {
    bar.style.width = "100%";
    bar.style.backgroundColor = "green";
    strength.textContent = "Сильный пароль";
  }
}

window.onload = function() {

  let savedLog = localStorage.getItem("log");

  if (savedLog) {
    document.getElementById("log").value = savedLog;
  }

}

</script>


</body>
</html>
